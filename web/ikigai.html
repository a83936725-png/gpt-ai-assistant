<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IKIGAI 生き甲斐</title>
<meta name="description" content="用四個圈找出你的 IKIGAI：熱愛、擅長、世界需要、可以獲得報酬。">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)">
<style>
  /* Layout: one centred column; the four circle colours carry through the progress bar, tags and diagram. */
  :root {
    --bg: #f6f5f2;
    --surface: #ffffff;
    --surface-2: #efede8;
    --text: #1d1c1a;
    --muted: #67625a;
    --border: #e3dfd7;
    --accent: #1d1c1a;
    --accent-text: #ffffff;
    --love: #dc4f67;
    --good: #dd9324;
    --need: #23988b;
    --paid: #4f63d6;
    --danger: #b3261e;
    --ok: #1f7a4f;
    --shadow: 0 1px 2px rgba(30, 25, 15, .06), 0 8px 24px rgba(30, 25, 15, .06);
    --blend: multiply;
    --radius: 16px;
    --ease: cubic-bezier(.2, .8, .2, 1);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416;
      --surface: #1d1d21;
      --surface-2: #26262b;
      --text: #f0eee9;
      --muted: #a29d94;
      --border: #34343a;
      --accent: #f0eee9;
      --accent-text: #141416;
      --love: #f27c90;
      --good: #f2b552;
      --need: #4ec6b7;
      --paid: #8796f3;
      --danger: #f2b8b5;
      --ok: #7fd3a6;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
      --blend: screen;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  button { font: inherit; color: inherit; }
  .wrap {
    max-width: 920px; margin: 0 auto;
    padding-block: 18px 120px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 2px solid var(--paid); outline-offset: 2px; }

  /* Header */
  .top { display: flex; align-items: center; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 0; cursor: pointer; text-align: left; }
  .brand svg { width: 34px; height: 34px; flex: none; }
  .brand b { font-size: 20px; letter-spacing: .04em; display: block; line-height: 1.1; }
  .brand small { color: var(--muted); font-size: 12px; letter-spacing: .25em; }
  .saved { margin-left: auto; font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; opacity: 0; transition: opacity .3s; }
  .saved.show { opacity: 1; }
  .saved::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }

  /* Progress */
  .progress { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; margin: 18px 0 20px; }
  .progress button {
    border: 0; background: none; padding: 0; cursor: pointer; display: grid; gap: 6px; text-align: left; min-width: 0;
  }
  .progress .bar { height: 6px; border-radius: 999px; background: var(--border); overflow: hidden; }
  .progress .bar i { display: block; height: 100%; width: 0; background: var(--c, var(--text)); border-radius: inherit; transition: width .5s var(--ease); }
  .progress .done .bar i, .progress [aria-current] .bar i { width: 100%; }
  .progress [aria-current] .bar i { opacity: .55; }
  .progress .done[aria-current] .bar i { opacity: 1; }
  .progress span { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .progress [aria-current] span { color: var(--text); font-weight: 700; }
  .progress .done span::after { content: " ✓"; color: var(--ok); }
  @media (max-width: 560px) { .progress span { font-size: 11px; } }

  /* Views */
  .view.fwd { animation: enter .45s var(--ease) both; }
  .view.back { animation: enter-back .45s var(--ease) both; }
  @keyframes enter { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
  @keyframes enter-back { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: none; } }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); }
  .card + .card { margin-top: 16px; }
  #aiCard { scroll-margin-top: 16px; }
  h1, h2, h3 { text-wrap: balance; line-height: 1.3; }
  .card h2 { margin: 0 0 6px; font-size: 22px; }
  .card h3 { margin: 18px 0 8px; font-size: 16px; }
  .hint { color: var(--muted); margin: 0 0 14px; }

  /* Intro */
  .intro { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 28px; align-items: center; margin-top: 36px; }
  @media (max-width: 720px) { .intro { grid-template-columns: 1fr; } }
  .intro h1 { font-size: clamp(30px, 6vw, 44px); margin: 0 0 10px; letter-spacing: .02em; }
  .intro h1 span { display: block; font-size: .45em; color: var(--muted); letter-spacing: .3em; font-weight: 500; margin-top: 6px; }
  .intro p { color: var(--muted); margin: 0 0 18px; }
  .intro ul { list-style: none; padding: 0; margin: 0 0 22px; display: grid; gap: 8px; }
  .intro li { display: flex; gap: 10px; align-items: baseline; }
  .intro li i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; transform: translateY(1px); }
  .intro .ctas { display: flex; flex-wrap: wrap; gap: 10px; }
  .intro-art svg { width: 100%; max-width: 380px; display: block; margin: 0 auto; }

  /* Diagram */
  svg.venn { width: 100%; height: auto; display: block; overflow: visible; }
  svg.venn circle.ring { mix-blend-mode: var(--blend); transform-box: fill-box; transform-origin: center; transition: fill-opacity .35s var(--ease), stroke-width .35s; }
  svg.venn.animate circle.ring { animation: pop .7s var(--ease) both; animation-delay: calc(var(--i) * 90ms); }
  svg.venn.float circle.ring { animation: pop .7s var(--ease) both, drift 7s ease-in-out infinite alternate; animation-delay: calc(var(--i) * 90ms), calc(.8s + var(--i) * .6s); }
  @keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
  @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(calc(var(--dx) * 1px), calc(var(--dy) * 1px)); } }
  svg.venn circle.dim { fill-opacity: .06; stroke-opacity: .35; }
  svg.venn circle.hl { fill-opacity: .42; stroke-width: 2.5; }
  svg.venn text { fill: var(--text); font-size: 13px; text-anchor: middle; pointer-events: none; }
  svg.venn text.lbl { font-size: 14px; font-weight: 700; }
  svg.venn text.n { font-size: 12px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  svg.venn text.center { font-size: 13px; font-weight: 800; letter-spacing: .05em; }
  svg.venn.compact text.lbl { font-size: 26px; }
  svg.venn.compact text.center { font-size: 22px; }
  svg.venn .hit { fill: transparent; cursor: pointer; transition: fill .2s; }
  svg.venn .hit:hover { fill: color-mix(in srgb, var(--text) 8%, transparent); }
  svg.venn .hit.on { fill: color-mix(in srgb, var(--text) 14%, transparent); }

  /* Circle step */
  .step-grid { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 18px; align-items: start; }
  .step-side { position: sticky; top: 16px; display: grid; gap: 10px; }
  .step-side .card { padding: 14px; }
  .step-side p { margin: 0; font-size: 13px; color: var(--muted); text-align: center; }
  /* On phones the diagram becomes a small, non-sticky strip above the form. */
  @media (max-width: 720px) {
    .step-grid { grid-template-columns: minmax(0, 1fr); gap: 12px; }
    .step-grid .step-side { position: static; grid-template-columns: 92px minmax(0, 1fr); align-items: center; gap: 12px; }
    .step-grid .step-side .card { padding: 6px; border-radius: 12px; }
    .step-grid .step-side p { text-align: left; }
  }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--c); margin-bottom: 6px; }
  .eyebrow::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
  .prompts { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; padding: 0; list-style: none; }
  .prompts li { font-size: 13.5px; color: var(--muted); background: var(--surface-2); border-radius: 8px; padding: 3px 10px; }

  .add-row { display: flex; gap: 8px; }
  input[type="text"], textarea {
    flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--bg);
    border: 1.5px solid var(--border); border-radius: 12px; padding: 11px 14px; transition: border-color .2s;
  }
  input[type="text"]:focus, textarea:focus { border-color: var(--c, var(--paid)); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--c, var(--paid)) 22%, transparent); }
  textarea { width: 100%; min-height: 84px; resize: vertical; }
  .field-hint { font-size: 12.5px; color: var(--muted); margin: 6px 2px 0; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border-radius: 12px; padding: 10px 18px; cursor: pointer; font-weight: 600;
    border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-text);
    transition: transform .15s var(--ease), opacity .2s, background .2s;
  }
  .btn:active { transform: scale(.97); }
  .btn.ghost { background: transparent; color: var(--text); border-color: var(--border); }
  .btn.ghost:hover { border-color: var(--muted); }
  .btn.danger { background: transparent; color: var(--danger); border-color: var(--border); }
  .btn.small { padding: 6px 12px; font-size: 14px; border-radius: 10px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; padding: 0; list-style: none; min-height: 38px; }
  .tag {
    display: inline-flex; align-items: center; gap: 4px; padding: 6px 6px 6px 13px; border-radius: 999px;
    background: color-mix(in srgb, var(--c) 15%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
  }
  .tag.fresh { animation: tag-in .35s var(--ease) both; }
  .tag.static { animation: none; padding-right: 13px; }
  .tag .also { display: inline-flex; gap: 2px; margin-left: 2px; }
  .tag .also i { width: 7px; height: 7px; border-radius: 50%; background: var(--d); }
  @keyframes tag-in { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: none; } }
  .tag button { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 17px; line-height: 1; width: 26px; height: 26px; border-radius: 50%; }
  .tag button:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }
  .empty { color: var(--muted); font-size: 14px; margin: 14px 0 0; padding: 14px; border: 1.5px dashed var(--border); border-radius: 12px; text-align: center; }
  .meter { font-size: 13px; color: var(--muted); margin-top: 10px; }
  .meter b { color: var(--text); font-variant-numeric: tabular-nums; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; align-items: center; }
  .chips > span { color: var(--muted); font-size: 13px; margin-right: 2px; }
  .chip { font-size: 14px; border: 1px dashed var(--border); background: transparent; border-radius: 999px; padding: 4px 11px; cursor: pointer; transition: border-color .2s, transform .15s; }
  .chip:hover { border-style: solid; border-color: var(--c, var(--muted)); }
  .chip:active { transform: scale(.95); }

  /* Sticky nav */
  .nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    padding-top: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .nav-inner { max-width: 920px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
  .nav-inner .info { color: var(--muted); font-size: 13px; flex: 1; min-width: 0; text-align: center; }
  .nav[hidden] { display: none; }

  /* Match step */
  .match-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 5px 12px; font-size: 13.5px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
  .items { display: grid; gap: 8px; }
  .item {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center;
    padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg);
  }
  .item .name { font-weight: 600; overflow-wrap: anywhere; }
  .item .dots { display: inline-flex; gap: 3px; margin-left: 8px; vertical-align: 1px; }
  .item .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--border); transition: background .25s; }
  .item .dots i.on { background: var(--text); }
  .toggles { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .toggle {
    border: 1.5px solid color-mix(in srgb, var(--c) 50%, transparent); background: transparent; color: var(--text);
    border-radius: 999px; padding: 4px 10px; font-size: 13px; cursor: pointer; white-space: nowrap;
    transition: background .2s, color .2s, transform .15s;
  }
  .toggle[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: #fff; }
  .toggle:active { transform: scale(.94); }
  @media (max-width: 560px) { .item { grid-template-columns: 1fr; } .toggles { justify-content: flex-start; } }

  /* Result */
  .result-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; align-items: start; }
  @media (max-width: 760px) { .result-grid { grid-template-columns: 1fr; } }
  .result-grid .diagram { max-width: 440px; margin: 0 auto; width: 100%; }
  .summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 0 0 18px; }
  .stat { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
  .stat b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .stat span { font-size: 12.5px; color: var(--muted); }
  .region { border-left: 4px solid var(--c, var(--border)); padding: 4px 0 4px 12px; margin: 0 0 16px; animation: enter .5s var(--ease) both; }
  .region h4 { margin: 0; font-size: 15px; }
  .region p { margin: 2px 0 6px; color: var(--muted); font-size: 14px; }
  .region .tags { margin-top: 4px; min-height: 0; }
  .filter-note { font-size: 14px; color: var(--muted); margin: 0 0 10px; }
  .filter-note button { border: 0; background: none; color: var(--paid); cursor: pointer; padding: 0; font-size: 14px; }
  .next-tip { background: color-mix(in srgb, var(--paid) 10%, transparent); border-radius: 12px; padding: 12px 14px; font-size: 14.5px; margin-top: 4px; }

  /* AI */
  .ai-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .status { font-size: 14px; color: var(--muted); }
  .alert { margin-top: 12px; border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent); background: color-mix(in srgb, var(--danger) 8%, transparent); border-radius: 12px; padding: 12px 14px; display: grid; gap: 10px; }
  .alert p { margin: 0; color: var(--danger); font-weight: 600; }
  .alert .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .skeleton { display: grid; gap: 10px; margin-top: 14px; }
  .skeleton i { height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--surface-2), var(--border), var(--surface-2)); background-size: 200% 100%; animation: shimmer 1.3s linear infinite; }
  .skeleton i:nth-child(2) { width: 85%; } .skeleton i:nth-child(3) { width: 92%; } .skeleton i:nth-child(4) { width: 60%; }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .ai-out { margin-top: 12px; }
  .ai-out h3 { font-size: 17px; margin: 18px 0 4px; }
  .ai-out h3:first-child { margin-top: 4px; }
  .ai-out ul, .ai-out ol { padding-left: 22px; margin: 4px 0; }
  .ai-out p { margin: 6px 0; }
  .ai-out > * { animation: enter .4s var(--ease) both; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; }
  .confirm { display: inline-flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; color: var(--danger); }


  /* Proportion legend */
  .legend { display: grid; gap: 6px; margin-top: 12px; }
  .legend-row { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13px; }
  .legend-row .lab { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .legend-row .lab i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
  .legend-row .track { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .legend-row .track b { display: block; height: 100%; border-radius: inherit; background: var(--c); width: 0; transition: width .8s var(--ease); }
  .legend-row .num { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 76px; }
  .legend-note { font-size: 12.5px; color: var(--muted); margin: 2px 0 0; text-align: center; }

  /* Career plan */
  .dirs { display: grid; gap: 12px; }
  .dir { border: 1.5px solid var(--border); border-radius: 14px; padding: 14px; background: var(--bg); display: grid; gap: 12px; transition: border-color .25s; }
  .dir.main { border-color: var(--text); }
  .dir-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .dir-head input { flex: 1 1 200px; font-weight: 700; }
  .badge { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 10px; background: var(--accent); color: var(--accent-text); white-space: nowrap; }
  .dir-body { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 14px; align-items: center; }
  @media (max-width: 560px) { .dir-body { grid-template-columns: 1fr; } .dir-body .mini { max-width: 180px; margin: 0 auto; } }
  .sliders { display: grid; gap: 6px; }
  .slider { display: grid; grid-template-columns: 70px minmax(0, 1fr) 30px; gap: 8px; align-items: center; font-size: 13.5px; }
  .slider input[type="range"] { width: 100%; accent-color: var(--c); }
  .slider output { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .fit { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .fit .track { flex: 1; height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .fit .track b { display: block; height: 100%; background: linear-gradient(90deg, var(--love), var(--good), var(--need), var(--paid)); border-radius: inherit; transition: width .4s var(--ease); }
  .goals { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 720px) { .goals { grid-template-columns: 1fr; } }
  .goal label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 4px; }
  .goal textarea { min-height: 72px; }
  .actions-list { display: grid; gap: 14px; margin-top: 8px; }
  .horizon h4 { margin: 0 0 6px; font-size: 13.5px; color: var(--muted); }
  .act { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); }
  .act + .act { margin-top: 6px; }
  .act input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--ok); flex: none; }
  .act label { flex: 1; min-width: 0; overflow-wrap: anywhere; cursor: pointer; }
  .act.done label { color: var(--muted); text-decoration: line-through; }
  .act button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 17px; width: 28px; height: 28px; border-radius: 50%; }
  .act button:hover { color: var(--danger); }
  .add-action { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; margin-top: 12px; }
  @media (max-width: 560px) { .add-action { grid-template-columns: minmax(0, 1fr) auto; } .add-action input { grid-column: 1 / -1; } }
  select { font: inherit; color: var(--text); background: var(--bg); border: 1.5px solid var(--border); border-radius: 12px; padding: 9px 10px; }
  .plan-progress { display: flex; align-items: center; gap: 10px; font-size: 14px; margin-top: 4px; }
  .plan-progress .track { flex: 1; height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .plan-progress .track b { display: block; height: 100%; background: var(--ok); border-radius: inherit; transition: width .4s var(--ease); }

  /* Share and export */
  .share-section + .share-section { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--border); }
  .share-section h3 { margin: 0 0 4px; }
  .cards-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
  @media (max-width: 640px) { .cards-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .card-prev { display: grid; gap: 8px; }
  .card-prev img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); animation: enter .4s var(--ease) both; }
  .card-prev .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .link-row { display: flex; gap: 8px; margin-top: 10px; }
  .link-row input { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  .opts { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-top: 8px; font-size: 14px; }
  .opts label { display: inline-flex; gap: 6px; align-items: center; }
  .opts input[type="text"] { flex: 0 1 200px; padding: 8px 12px; }
  .fine { font-size: 12.5px; color: var(--muted); margin: 8px 0 0; }

  /* Shared view */
  .banner { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; background: color-mix(in srgb, var(--paid) 12%, transparent); border-radius: 14px; padding: 12px 16px; margin: 18px 0 16px; }
  .banner p { margin: 0; }
  .plan-read .goal-box { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
  .plan-read .goal-box b { display: block; font-size: 13px; color: var(--muted); }
  .report { display: none; }

  /* Toast */
  .toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 30; display: grid; gap: 8px; width: min(440px, calc(100% - 32px)); pointer-events: none; }
  .toast {
    pointer-events: auto; display: flex; align-items: center; gap: 12px; justify-content: space-between;
    background: var(--accent); color: var(--accent-text); border-radius: 12px; padding: 10px 14px; font-size: 14px;
    box-shadow: var(--shadow); animation: toast-in .3s var(--ease) both;
  }
  .toast button { border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; white-space: nowrap; }
  .toast.out { animation: toast-out .25s ease both; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes toast-out { to { opacity: 0; transform: translateY(6px); } }

  footer { margin-top: 28px; color: var(--muted); font-size: 13px; text-align: center; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
  @media print {
    @page { size: A4; margin: 14mm; }
    :root { --bg: #fff; --surface: #fff; --surface-2: #f2f0ec; --text: #1d1c1a; --muted: #5d5850; --border: #ddd8cf; --blend: multiply; color-scheme: light; }
    body { background: #fff; color: #1d1c1a; font-size: 11pt; }
    .wrap, .nav, .toasts { display: none !important; }
    .report { display: block !important; }
    .report h1 { font-size: 22pt; margin: 0 0 2mm; }
    .report h2 { font-size: 14pt; margin: 7mm 0 2mm; border-bottom: 1px solid var(--border); padding-bottom: 1.5mm; }
    .report .meta { color: var(--muted); margin: 0 0 5mm; }
    .report .r-top { display: grid; grid-template-columns: 78mm 1fr; gap: 8mm; align-items: center; }
    .report .r-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3mm; margin-bottom: 4mm; }
    .report .r-stats div { background: var(--surface-2); border-radius: 3mm; padding: 2.5mm 3mm; }
    .report .r-stats b { display: block; font-size: 16pt; }
    .report table { width: 100%; border-collapse: collapse; }
    .report td, .report th { text-align: left; vertical-align: top; padding: 1.8mm 2mm; border-bottom: 1px solid var(--border); }
    .report th { width: 34mm; white-space: nowrap; }
    .report .dot { display: inline-block; width: 3mm; height: 3mm; border-radius: 50%; background: var(--c); margin-right: 1.5mm; }
    .report section { break-inside: avoid; }
    .report .ai p, .report .ai li { margin: 1mm 0; }
    .report .ai h3 { font-size: 12pt; margin: 3mm 0 1mm; }
    .report .foot { margin-top: 8mm; color: var(--muted); font-size: 9pt; text-align: center; }
    .report svg.venn { width: 78mm; }
    .report svg.venn circle.ring { animation: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="brand" type="button" id="home" aria-label="回到開始">
      <svg viewBox="0 0 34 34" aria-hidden="true">
        <circle cx="17" cy="11" r="8" fill="var(--love)" fill-opacity=".55"/>
        <circle cx="11" cy="17" r="8" fill="var(--good)" fill-opacity=".55"/>
        <circle cx="23" cy="17" r="8" fill="var(--need)" fill-opacity=".55"/>
        <circle cx="17" cy="23" r="8" fill="var(--paid)" fill-opacity=".55"/>
      </svg>
      <span><b>IKIGAI</b><small>生き甲斐</small></span>
    </button>
    <span class="saved" id="saved" role="status">已自動儲存</span>
  </header>

  <nav class="progress" id="progress" aria-label="步驟"></nav>
  <main id="view"></main>

  <footer>內容只存在這台裝置的瀏覽器。只有按下「AI 分析」時，清單才會送到伺服器。</footer>
</div>

<div class="nav" id="nav" hidden><div class="nav-inner" id="navInner"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="report" id="report"></div>
<input type="file" id="importFile" accept="application/json,.json" class="sr-only" aria-hidden="true" tabindex="-1">

<script>
(() => {
  const CIRCLES = [
    { key: 'love', label: '你熱愛的', short: '熱愛', color: 'var(--love)', hex: '#dc4f67',
      hint: '做什麼事會讓你忘記時間？就算沒有錢也想做的事。',
      prompts: ['做什麼會忘記時間？', '小時候最愛做什麼？', '週末自然會去做的事？'],
      examples: ['寫作', '學習新知', '和人聊天', '設計', '運動', '音樂', '料理', '旅行', '照顧動物', '解決難題'] },
    { key: 'good', label: '你擅長的', short: '擅長', color: 'var(--good)', hex: '#dd9324',
      hint: '別人常找你幫忙什麼？包含技能，也包含特質。',
      prompts: ['朋友常找你幫什麼忙？', '學得比別人快的事？', '被稱讚過的能力？'],
      examples: ['溝通表達', '數據分析', '寫程式', '組織規劃', '教學', '攝影', '傾聽', '銷售', '研究', '手作'] },
    { key: 'need', label: '世界需要的', short: '世界需要', color: 'var(--need)', hex: '#23988b',
      hint: '你在意哪些問題？身邊的人、社區或社會缺少什麼？',
      prompts: ['身邊的人常抱怨什麼？', '新聞上你最在意的問題？', '十年前的你需要什麼幫助？'],
      examples: ['心理健康支持', '環境永續', '教育資源', '長期照顧', '數位能力', '在地社區', '食品安全', '資訊辨識'] },
    { key: 'paid', label: '可以獲得報酬的', short: '報酬', color: 'var(--paid)', hex: '#4f63d6',
      hint: '有人願意為哪些事付錢？你現在或過去靠什麼賺錢？',
      prompts: ['現在靠什麼賺錢？', '別人付過錢請你做的事？', '市場上有哪些相關職缺？'],
      examples: ['顧問', '軟體開發', '內容創作', '課程講師', '行銷企劃', '設計接案', '業務', '翻譯'] },
  ];
  const KEYS = CIRCLES.map((c) => c.key);
  const BY_KEY = Object.fromEntries(CIRCLES.map((c) => [c.key, c]));
  const PAIRS = [
    { keys: ['love', 'good'], name: '熱情 Passion', short: '熱情', desc: '熱愛 × 擅長：做起來開心又做得好。' },
    { keys: ['love', 'need'], name: '使命 Mission', short: '使命', desc: '熱愛 × 世界需要：讓你覺得有意義的事。' },
    { keys: ['good', 'paid'], name: '專業 Profession', short: '專業', desc: '擅長 × 報酬：能穩定賺錢的能力。' },
    { keys: ['need', 'paid'], name: '天職 Vocation', short: '天職', desc: '世界需要 × 報酬：市場願意付錢解決的問題。' },
    { keys: ['love', 'paid'], name: '熱愛 × 報酬', desc: '喜歡、也有人付錢，但還需要練到夠好、找到意義。' },
    { keys: ['good', 'need'], name: '擅長 × 世界需要', desc: '能幫上忙的能力，想想怎麼讓它有收入、也讓你投入。' },
  ];
  const TRIPLES = [
    { missing: 'need', desc: '滿足，但覺得自己沒那麼有用。想想誰需要它。' },
    { missing: 'paid', desc: '喜悅又充實，但還不富裕。想想誰願意付錢。' },
    { missing: 'good', desc: '興奮，但能力還不確定。需要刻意練習。' },
    { missing: 'love', desc: '舒適，但可能感到空虛。找找讓自己投入的部分。' },
  ];
  const HORIZONS = [
    { key: 'd30', label: '30 天' },
    { key: 'd90', label: '90 天' },
    { key: 'y1', label: '1 年' },
  ];
  const MAX_DIRS = 3;
  const MAX_ACTIONS = 30;
  const SAMPLE = {
    items: [
      ['寫作', 'love good need paid'], ['教學', 'good need paid'], ['和人聊天', 'love good'],
      ['學習新知', 'love need'], ['數據分析', 'good paid'], ['攝影', 'love'], ['料理', 'love'],
      ['教育資源', 'need'], ['課程講師', 'paid need'], ['心理健康支持', 'need love'],
    ],
    note: '範例：目前是工程師，工作 5 年，想找下一步方向。',
    plan: {
      dirs: [['技術寫作與教學創作者', 5, 4, 4, 3], ['企業內訓講師', 3, 4, 3, 5]],
      goals: { d30: '每週發表 1 篇教學文章，共 4 篇', d90: '開一堂 2 小時的線上小課，招到 10 位學員', y1: '寫作與教學收入達到每月 2 萬元' },
      actions: [['訪談 3 位在做技術寫作的人', 'd30', true], ['每週寫一篇學習筆記', 'd30', false], ['建立作品集網頁', 'd30', false],
        ['設計第一堂小課的大綱', 'd90', false], ['找到第一位付費學員', 'd90', false], ['和 2 家公司洽談內訓', 'y1', false]],
    },
  };

  const STORE_KEY = 'ikigai:v1';
  const STEP_LIST = [...CIRCLES.map((c) => ({ id: c.key, label: c.short, color: c.color })),
    { id: 'match', label: '交集對照' }, { id: 'result', label: '結果' }, { id: 'plan', label: '生涯規劃' }];
  const ORDER = ['intro', ...STEP_LIST.map((s) => s.id)];
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const blankPlan = () => ({ dirs: [], main: null, goals: { d30: '', d90: '', y1: '' }, actions: [] });
  const blank = () => ({ items: [], note: '', step: 'intro', ai: '', name: '', plan: blankPlan() });
  let shareMode = false;
  let state = load();
  let filter = null;
  let matchFilter = 'all';
  let aiAvailable = true;
  let aiError = null;
  let aiBusy = false;
  let planBusy = false;
  let planError = null;
  let animateResult = true;
  let lastStep = state.step;
  const seenTags = new Set();
  let cardUrls = [];

  // ---------- storage ----------
  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        const s = sanitize(JSON.parse(raw));
        if (!s.items.length && s.step !== 'intro') s.step = 'intro';
        return s;
      }
    } catch (e) { /* storage unavailable */ }
    return blank();
  }
  let savedTimer;
  function save(quiet) {
    if (shareMode) return;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { return; }
    if (quiet) return;
    const el = document.getElementById('saved');
    el.classList.add('show');
    clearTimeout(savedTimer);
    savedTimer = setTimeout(() => el.classList.remove('show'), 1600);
  }
  // Function declarations, so load() can use them before this point in the file runs.
  function str(v, max) { return typeof v === 'string' ? v.slice(0, max) : ''; }
  function score(v) { return Math.min(5, Math.max(1, Math.round(Number(v)) || 3)); }
  function sanitizePlan(p) {
    const plan = blankPlan();
    if (!p || typeof p !== 'object') return plan;
    (Array.isArray(p.dirs) ? p.dirs : []).slice(0, MAX_DIRS).forEach((d) => {
      const title = str(d?.title, 60).trim();
      if (!title) return;
      plan.dirs.push({ id: str(d.id, 20) || uid(), title, s: Object.fromEntries(KEYS.map((k) => [k, score(d.s?.[k])])) });
    });
    plan.main = plan.dirs.some((d) => d.id === p.main) ? p.main : (plan.dirs[0]?.id || null);
    HORIZONS.forEach(({ key }) => { plan.goals[key] = str(p.goals?.[key], 200); });
    (Array.isArray(p.actions) ? p.actions : []).slice(0, MAX_ACTIONS).forEach((a) => {
      const text = str(a?.text, 80).trim();
      if (!text) return;
      plan.actions.push({ id: str(a.id, 20) || uid(), text, h: HORIZONS.some((h) => h.key === a.h) ? a.h : 'd30', done: Boolean(a.done) });
    });
    return plan;
  }
  function sanitize(data) {
    const s = blank();
    if (data && Array.isArray(data.items)) {
      data.items.slice(0, 80).forEach((it) => {
        if (!it || typeof it.text !== 'string') return;
        const text = it.text.trim().slice(0, 60);
        if (!text) return;
        const c = {};
        KEYS.forEach((k) => { c[k] = Boolean(it.c && it.c[k]); });
        if (!KEYS.some((k) => c[k])) return;
        if (!s.items.some((x) => x.text === text)) s.items.push({ id: it.id || uid(), text, c });
      });
    }
    s.note = str(data?.note, 300);
    s.ai = str(data?.ai, 8000);
    s.name = str(data?.name, 20);
    s.plan = sanitizePlan(data?.plan);
    if (ORDER.includes(data?.step)) s.step = data.step;
    return s;
  }
  function uid() { return Math.random().toString(36).slice(2, 10); }

  // ---------- helpers ----------
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const inCircle = (k) => state.items.filter((it) => it.c[k]);
  const hasAll = (it, keys) => keys.every((k) => it.c[k]);
  const exact = (it, keys) => KEYS.every((k) => it.c[k] === keys.includes(k));
  const circlesOf = (it) => KEYS.filter((k) => it.c[k]);
  const mainDir = () => state.plan.dirs.find((d) => d.id === state.plan.main) || null;
  const fitOf = (d) => KEYS.reduce((sum, k) => sum + d.s[k], 0);
  const today = () => new Date().toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric' });
  const owner = () => (state.name ? `${state.name}的` : '我的');
  const stepDone = (id) => {
    if (KEYS.includes(id)) return inCircle(id).length > 0;
    if (id === 'match') return state.items.some((it) => circlesOf(it).length > 1);
    if (id === 'result') return Boolean(state.ai) || state.plan.dirs.length > 0;
    if (id === 'plan') return Boolean(mainDir()) && state.plan.actions.length > 0;
    return false;
  };

  function toast(text, action) {
    const box = $('toasts');
    const el = document.createElement('div');
    el.className = 'toast';
    const span = document.createElement('span');
    span.textContent = text;
    el.appendChild(span);
    const dismiss = () => { el.classList.add('out'); setTimeout(() => el.remove(), 260); };
    if (action) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = action.label;
      b.addEventListener('click', () => { action.run(); dismiss(); });
      el.appendChild(b);
    }
    box.appendChild(el);
    setTimeout(dismiss, action ? 6000 : 2600);
    while (box.children.length > 3) box.firstChild.remove();
  }

  // ---------- data changes ----------
  function addItem(key, text) {
    text = text.replace(/\s+/g, ' ').trim().slice(0, 60);
    if (!text) return 'empty';
    const found = state.items.find((it) => it.text.toLowerCase() === text.toLowerCase());
    if (found) {
      if (found.c[key]) return 'dup';
      found.c[key] = true;
    } else {
      if (inCircle(key).length >= 20) return 'full';
      state.items.push({ id: uid(), text, c: Object.fromEntries(KEYS.map((k) => [k, k === key])) });
    }
    state.ai = '';
    return 'ok';
  }
  function addMany(key, raw) {
    const results = raw.split(/[,，、;；\n]/).map((t) => addItem(key, t));
    save();
    const added = results.filter((r) => r === 'ok').length;
    if (results.includes('full')) toast('每個圈最多 20 項');
    else if (!added && results.includes('dup')) toast('這一項已經在這個圈裡了');
    return added;
  }
  function removeFromCircle(id, key) {
    const it = state.items.find((x) => x.id === id);
    if (!it) return;
    const before = JSON.parse(JSON.stringify(state.items));
    it.c[key] = false;
    if (!KEYS.some((k) => it.c[k])) state.items = state.items.filter((x) => x.id !== id);
    state.ai = '';
    save();
    toast(`已從「${BY_KEY[key].short}」移除「${it.text}」`, { label: '復原', run: () => { state.items = before; save(); render(); } });
  }
  function loadSample() {
    state = blank();
    SAMPLE.items.forEach(([text, keys]) => {
      const set = keys.split(' ');
      state.items.push({ id: uid(), text, c: Object.fromEntries(KEYS.map((k) => [k, set.includes(k)])) });
    });
    state.note = SAMPLE.note;
    SAMPLE.plan.dirs.forEach(([title, ...nums]) => state.plan.dirs.push({ id: uid(), title, s: Object.fromEntries(KEYS.map((k, i) => [k, nums[i]])) }));
    state.plan.main = state.plan.dirs[0].id;
    state.plan.goals = { ...SAMPLE.plan.goals };
    state.plan.actions = SAMPLE.plan.actions.map(([text, h, done]) => ({ id: uid(), text, h, done }));
    state.step = 'result';
    animateResult = true;
    save();
    render();
    toast('已載入範例，隨時可以按「全部清除」重新開始');
  }

  function go(step) {
    if (step === state.step) return;
    lastStep = state.step;
    state.step = step;
    if (step === 'result') animateResult = true;
    save(true);
    render();
    window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
  }
  const nextOf = (step) => ORDER[Math.min(ORDER.indexOf(step) + 1, ORDER.length - 1)];
  const prevOf = (step) => ORDER[Math.max(ORDER.indexOf(step) - 1, 0)];

  // ---------- proportional circles ----------
  const CENTERS = { love: [200, 132], good: [132, 200], need: [268, 200], paid: [200, 268] };
  // Each circle's area follows its weight; the largest circle keeps full size.
  function radiiFrom(weights) {
    const max = Math.max(...KEYS.map((k) => weights[k] || 0));
    return Object.fromEntries(KEYS.map((k) => [k, max ? 62 + 46 * Math.sqrt((weights[k] || 0) / max) : 98]));
  }
  const countWeights = () => Object.fromEntries(KEYS.map((k) => [k, inCircle(k).length]));

  function venn(opts = {}) {
    const {
      highlight, counts = true, interactive = false, anim = false, float = false, compact = false, radii = null,
    } = opts;
    const r = radii || (state.items.length ? radiiFrom(countWeights()) : radiiFrom({ love: 1, good: 1, need: 1, paid: 1 }));
    const count = (keys) => state.items.filter((it) => hasAll(it, keys)).length;
    const drift = { love: [0, -5], good: [-5, 0], need: [5, 0], paid: [0, 5] };
    const labelPos = compact
      ? { love: [200, 22], good: [30, 208], need: [370, 208], paid: [200, 392] }
      : { love: [200, 30], good: [36, 196], need: [364, 196], paid: [200, 376] };
    const pairPos = [
      { keys: ['love', 'good'], xy: [142, 142], name: '熱情' },
      { keys: ['love', 'need'], xy: [258, 142], name: '使命' },
      { keys: ['good', 'paid'], xy: [142, 258], name: '專業' },
      { keys: ['need', 'paid'], xy: [258, 258], name: '天職' },
    ];
    const isOn = (keys) => filter && filter.length === keys.length && keys.every((k) => filter.includes(k));
    const rings = CIRCLES.map((c, i) => {
      const cls = highlight ? (highlight === c.key ? 'hl' : 'dim') : '';
      const empty = !radii && state.items.length && !inCircle(c.key).length ? ' stroke-dasharray="6 6"' : '';
      return `<circle class="ring ${cls}" style="--i:${i};--dx:${drift[c.key][0]};--dy:${drift[c.key][1]}" cx="${CENTERS[c.key][0]}" cy="${CENTERS[c.key][1]}" r="${r[c.key].toFixed(1)}" fill="${c.color}" fill-opacity=".26" stroke="${c.color}" stroke-width="1.5"${empty}/>`;
    }).join('');
    const labels = CIRCLES.map((c) => {
      const [x, y] = labelPos[c.key];
      const hit = interactive ? `<circle class="hit ${isOn([c.key]) ? 'on' : ''}" data-filter="${c.key}" cx="${x}" cy="${y + 6}" r="30" tabindex="0" role="button" aria-label="篩選${c.label}"></circle>` : '';
      const n = counts ? `<text class="n" x="${x}" y="${y + 18}" data-count="${inCircle(c.key).length}">${inCircle(c.key).length} 項</text>` : '';
      return `${hit}<text class="lbl" x="${x}" y="${y}">${c.short}</text>${n}`;
    }).join('');
    const pairs = pairPos.map((p) => {
      if (compact) return '';
      const hit = interactive ? `<circle class="hit ${isOn(p.keys) ? 'on' : ''}" data-filter="${p.keys.join(',')}" cx="${p.xy[0]}" cy="${p.xy[1] + 4}" r="24" tabindex="0" role="button" aria-label="篩選${p.name}"></circle>` : '';
      const n = counts ? `<text class="n" x="${p.xy[0]}" y="${p.xy[1] + 16}" data-count="${count(p.keys)}">${count(p.keys)}</text>` : '';
      return `${hit}<text x="${p.xy[0]}" y="${p.xy[1]}">${p.name}</text>${n}`;
    }).join('');
    const cHit = interactive ? `<circle class="hit ${isOn(KEYS) ? 'on' : ''}" data-filter="${KEYS.join(',')}" cx="200" cy="204" r="24" tabindex="0" role="button" aria-label="篩選 IKIGAI 中心"></circle>` : '';
    const cN = counts ? `<text class="n" x="200" y="216" data-count="${count(KEYS)}">${count(KEYS)}</text>` : '';
    const cls = `venn${anim && !reduceMotion ? ' animate' : ''}${float && !reduceMotion ? ' float' : ''}${compact ? ' compact' : ''}`;
    return `<svg class="${cls}" viewBox="0 0 400 400" role="img" aria-label="IKIGAI 四圈圖，圓的大小代表各圈的份量">${rings}${labels}${pairs}${cHit}<text class="center" x="200" y="200">IKIGAI</text>${cN}</svg>`;
  }

  function legendHtml() {
    const total = KEYS.reduce((n, k) => n + inCircle(k).length, 0) || 1;
    const max = Math.max(...KEYS.map((k) => inCircle(k).length)) || 1;
    return `<div class="legend">${CIRCLES.map((c) => {
      const n = inCircle(c.key).length;
      return `<div class="legend-row" style="--c:${c.color}"><span class="lab"><i></i>${c.short}</span><span class="track"><b data-w="${(n / max) * 100}"></b></span><span class="num">${n} 項 · ${Math.round((n / total) * 100)}%</span></div>`;
    }).join('')}<p class="legend-note">圓越大，代表這一圈寫得越多</p></div>`;
  }
  function growBars(root) {
    requestAnimationFrame(() => root.querySelectorAll('[data-w]').forEach((b) => { b.style.width = `${b.dataset.w}%`; }));
  }

  function countUp(root) {
    if (reduceMotion) return;
    root.querySelectorAll('[data-count]').forEach((el) => {
      const target = Number(el.dataset.count);
      if (!target) return;
      const suffix = el.textContent.replace(/^\d+/, '');
      const start = performance.now();
      const tick = (now) => {
        const p = Math.min(1, (now - start) / 700);
        el.textContent = Math.round(target * (1 - (1 - p) ** 3)) + suffix;
        if (p < 1) requestAnimationFrame(tick);
      };
      el.textContent = `0${suffix}`;
      requestAnimationFrame(tick);
    });
  }

  // ---------- chrome ----------
  function renderProgress() {
    const nav = $('progress');
    nav.hidden = state.step === 'intro' || shareMode;
    nav.style.gridTemplateColumns = `repeat(${STEP_LIST.length}, minmax(0, 1fr))`;
    nav.innerHTML = STEP_LIST.map((st) => {
      const cur = state.step === st.id ? 'aria-current="step"' : '';
      const n = KEYS.includes(st.id) ? `（${inCircle(st.id).length}）` : '';
      return `<button type="button" data-step="${st.id}" class="${stepDone(st.id) ? 'done' : ''}" ${cur} style="--c:${st.color || 'var(--text)'}" aria-label="${st.label}${n}">
        <div class="bar"><i></i></div><span>${st.label}</span></button>`;
    }).join('');
  }

  function renderNav() {
    const nav = $('nav');
    const step = state.step;
    if (step === 'intro' || shareMode) { nav.hidden = true; return; }
    nav.hidden = false;
    const idx = ORDER.indexOf(step);
    let info = '';
    if (KEYS.includes(step)) {
      const n = inCircle(step).length;
      info = n ? `已寫 ${n} 項` : '先寫 1 項以上';
    } else if (step === 'match') {
      info = `${state.items.filter((it) => circlesOf(it).length > 1).length} 項跨圈`;
    } else if (step === 'plan') {
      const done = state.plan.actions.filter((a) => a.done).length;
      info = state.plan.actions.length ? `行動完成 ${done}/${state.plan.actions.length}` : '';
    }
    let back = '上一步';
    if (idx <= 1) back = '介紹';
    else if (step === 'result') back = '調整勾選';
    else if (step === 'plan') back = '結果';
    let right = `<button class="btn" type="button" data-go="${nextOf(step)}">下一步 →</button>`;
    if (step === 'paid') right = '<button class="btn" type="button" data-go="match">交集對照 →</button>';
    if (step === 'match') right = '<button class="btn" type="button" data-go="result">看結果 →</button>';
    if (step === 'result') right = '<button class="btn" type="button" data-go="plan">生涯規劃 →</button>';
    if (step === 'plan') right = '<button class="btn" type="button" data-scroll="shareCard">分享與匯出 ↓</button>';
    $('navInner').innerHTML = `
      <button class="btn ghost" type="button" data-go="${prevOf(step)}">← ${back}</button>
      <span class="info">${info}</span>
      ${right}`;
  }

  // Slide only when the step changes, not when the same step re-renders.
  function viewClass() {
    if (lastStep === state.step) return 'view';
    return ORDER.indexOf(state.step) < ORDER.indexOf(lastStep) ? 'view back' : 'view fwd';

  // ---------- circle steps ----------
  function tagHtml(it, key, color) {
    const others = circlesOf(it).filter((k) => k !== key);
    const also = others.length ? `<span class="also" title="也在：${others.map((k) => BY_KEY[k].short).join('、')}">${others.map((k) => `<i style="--d:${BY_KEY[k].color}"></i>`).join('')}</span>` : '';
    const btn = key ? `<button type="button" data-remove="${it.id}" data-key="${key}" aria-label="移除 ${esc(it.text)}">×</button>` : '';
    const fresh = key && !seenTags.has(`${key}:${it.id}`) ? ' fresh' : '';
    if (key) seenTags.add(`${key}:${it.id}`);
    return `<li class="tag${key ? '' : ' static'}${fresh}" data-id="${it.id}" style="--c:${color || 'var(--muted)'}">${esc(it.text)}${also}${btn}</li>`;
  }

  function renderCircle(key, focus) {
    const c = BY_KEY[key];
    const idx = KEYS.indexOf(key);
    const items = inCircle(key);
    const others = state.items.filter((it) => !it.c[key]);
    const unusedExamples = c.examples.filter((e) => !state.items.some((it) => it.text === e && it.c[key]));
    $('view').innerHTML = `
      <section class="${viewClass()} step-grid" style="--c:${c.color}">
        <aside class="step-side"><div class="card">${venn({ highlight: key, compact: true, counts: false })}</div><p>第 ${idx + 1} 圈，共 4 圈 · 這一圈 ${items.length} 項<br>寫越多，圓就越大</p></aside>
        <div class="card">
          <div class="eyebrow">第 ${idx + 1} 步 · ${c.short}</div>
          <h2>${c.label}</h2>
          <p class="hint">${c.hint}</p>
          <ul class="prompts" aria-label="提示問題">${c.prompts.map((p) => `<li>${p}</li>`).join('')}</ul>
          <form class="add-row" id="addForm">
            <label class="sr-only" for="addInput">新增${c.label}</label>
            <input type="text" id="addInput" maxlength="200" placeholder="輸入後按 Enter" autocomplete="off" enterkeyhint="done">
            <button class="btn" type="submit">新增</button>
          </form>
          <p class="field-hint">可一次輸入多項，用逗號、頓號或換行分隔。每項最多 60 字。</p>
          ${items.length ? `<ul class="tags" id="tags">${items.map((it) => tagHtml(it, key, c.color)).join('')}</ul>` : '<p class="empty">還沒有項目。先寫 3 到 8 項就很好，也可以點下面的靈感。</p>'}
          ${items.length ? `<p class="meter">已寫 <b>${items.length}</b> 項${items.length < 3 ? '，再想 1、2 項會更完整' : items.length > 10 ? '，很充實了' : ''}</p>` : ''}
          ${unusedExamples.length ? `<div class="chips"><span>靈感</span>${unusedExamples.map((e) => `<button type="button" class="chip" data-chip="${esc(e)}">+ ${esc(e)}</button>`).join('')}</div>` : ''}
          ${others.length ? `<div class="chips"><span>其他圈寫過的</span>${others.map((it) => `<button type="button" class="chip" data-chip="${esc(it.text)}">+ ${esc(it.text)}</button>`).join('')}</div>` : ''}
        </div>
      </section>`;
    const input = $('addInput');
    $('addForm').addEventListener('submit', (e) => {
      e.preventDefault();
      if (!input.value.trim()) { input.focus(); return; }
      addMany(key, input.value);
      input.value = '';
      render({ focusInput: true });
    });
    input.addEventListener('paste', (e) => {
      const t = e.clipboardData.getData('text');
      if (/\n/.test(t)) { e.preventDefault(); addMany(key, t); render({ focusInput: true }); }
    });
    if (focus) input.focus({ preventScroll: true });
  }

              <div class="toggles">${CIRCLES.map((c) => `<button type="button" class="toggle" style="--c:${c.color}" data-id="${it.id}" data-key="${c.key}" aria-pressed="${it.c[c.key]}" aria-label="${esc(it.text)} 屬於${c.label}">${c.short}</button>`).join('')}</div>

  // ---------- result ----------
  function regionHtml(title, desc, items, color, i) {
    if (!items.length) return '';
    return `<div class="region" style="--c:${color};animation-delay:${i * 60}ms"><h4>${title}（${items.length}）</h4><p>${desc}</p>
      <ul class="tags">${items.map((it) => tagHtml(it, null, color)).join('')}</ul></div>`;
  }

  function regionsHtml() {
    const pool = filter ? state.items.filter((it) => hasAll(it, filter)) : state.items;
    const parts = [];
    parts.push(regionHtml('IKIGAI 中心', '同時落在四個圈。這是最值得投入的方向。', pool.filter((it) => hasAll(it, KEYS)), 'var(--text)', 0));
    TRIPLES.forEach((t, i) => {
      const keys = KEYS.filter((k) => k !== t.missing);
      parts.push(regionHtml(`差一圈：缺「${BY_KEY[t.missing].short}」`, `${keys.map((k) => BY_KEY[k].short).join(' × ')}。${t.desc}`, pool.filter((it) => exact(it, keys)), BY_KEY[t.missing].color, i + 1));
    });
    PAIRS.forEach((p, i) => parts.push(regionHtml(p.name, p.desc, pool.filter((it) => exact(it, p.keys)), BY_KEY[p.keys[0]].color, i + 5)));
    CIRCLES.forEach((c, i) => parts.push(regionHtml(`只在「${c.short}」`, '目前只屬於一個圈，回到交集對照看看能不能多勾一圈。', pool.filter((it) => exact(it, [c.key])), c.color, i + 11)));
    const html = parts.filter(Boolean).join('');
    const note = filter ? `<p class="filter-note">只顯示包含「${filter.map((k) => BY_KEY[k].short).join(' × ')}」的項目。<button type="button" id="clearFilter">顯示全部</button></p>` : '';
    return note + (html || '<p class="empty">沒有符合的項目。</p>');
  }

  function nextTip() {
    const center = state.items.filter((it) => hasAll(it, KEYS)).length;
    const near = state.items.filter((it) => circlesOf(it).length === 3);
    const weakest = CIRCLES.slice().sort((a, b) => inCircle(a.key).length - inCircle(b.key).length)[0];
    if (center) return `你有 <b>${center}</b> 項落在中心。下一步到「生涯規劃」，把它變成具體方向。`;
    if (near.length) {
      const it = near[0];
      const miss = BY_KEY[KEYS.find((k) => !it.c[k])];
      return `「${esc(it.text)}」只差「${miss.short}」一圈。想想看：${miss.hint}`;
    }
    return `目前最小的圈是「${weakest.short}」（${inCircle(weakest.key).length} 項），回去補幾項，交集會更清楚。`;
  }

  function mdToHtml(md) {
    const lines = esc(md).split('\n');
    let html = '';
    let list = null;
    const inline = (s) => s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    const close = () => { if (list) { html += `</${list}>`; list = null; } };
    lines.forEach((raw) => {
      const line = raw.trim();
      let m;
      if (!line) { close(); return; }
      if ((m = line.match(/^#{1,6}\s+(.*)$/))) { close(); html += `<h3>${inline(m[1])}</h3>`; return; }
      if ((m = line.match(/^[-*•]\s+(.*)$/))) { if (list !== 'ul') { close(); html += '<ul>'; list = 'ul'; } html += `<li>${inline(m[1])}</li>`; return; }
      if ((m = line.match(/^\d+[.)、]\s*(.*)$/))) { if (list !== 'ol') { close(); html += '<ol>'; list = 'ol'; } html += `<li>${inline(m[1])}</li>`; return; }
      close();
      html += `<p>${inline(line)}</p>`;
    });
    close();
    return html;
  }

  function aiBlock() {
    const filled = KEYS.filter((k) => inCircle(k).length).length;
    let status = '';
    if (!aiAvailable) status = '這個網站沒有開啟 AI 分析。可以按「複製提示詞」貼到其他 AI 助理。';
    else if (filled < 2) status = '至少填兩個圈才能分析。';
    else if (!state.ai && !aiBusy) status = '約需 10 到 30 秒。';
    const err = aiError ? `<div class="alert" role="alert"><p>${esc(aiError)}</p>
        <div class="row"><button class="btn small" type="button" id="aiRetry">重試</button><button class="btn ghost small" type="button" id="aiCopy2">複製提示詞，改貼到其他 AI 助理</button></div></div>` : '';
    const body = aiBusy ? '<div class="skeleton" aria-hidden="true"><i></i><i></i><i></i><i></i></div>' : (state.ai ? mdToHtml(state.ai) : '');
    return `
      <div class="ai-head">
        <button class="btn" type="button" id="aiBtn" ${filled < 2 || !aiAvailable || aiBusy ? 'disabled' : ''}>${aiBusy ? '分析中…' : state.ai ? '重新分析' : 'AI 分析'}</button>

      </div>
      ${err}
      <div class="ai-out" id="aiOut" aria-busy="${aiBusy}">${body}</div>`;
  }

    const cross = state.items.filter((it) => circlesOf(it).length > 1).length;

      <div class="summary">
        <div class="stat"><b data-count="${center}">${center}</b><span>IKIGAI 中心</span></div>
        <div class="stat"><b data-count="${near}">${near}</b><span>差一圈</span></div>
        <div class="stat"><b data-count="${cross}">${cross}</b><span>跨圈項目</span></div>

  function renderResult() {
    $('view').innerHTML = `
      <section class="${viewClass()}">
        <div class="card">
          <div class="eyebrow" style="--c:var(--text)">第 6 步 · 結果</div>
          <h2>${esc(owner())} IKIGAI</h2>

        <div class="card" id="aiCard">

      </section>`;

  function refreshRegions() {
    $('regions').innerHTML = regionsHtml();
    document.querySelectorAll('svg.venn .hit').forEach((h) => {
      const keys = h.dataset.filter.split(',');
      h.classList.toggle('on', Boolean(filter && filter.join() === keys.join()));
    });
    bindClearFilter();
  }
  function bindClearFilter() {
    const clear = $('clearFilter');
    if (clear) clear.addEventListener('click', () => { filter = null; refreshRegions(); });
  }
  function refreshAi() { if (!$('aiBox')) return; $('aiBox').innerHTML = aiBlock(); bindAi(); }
  function bindAi() {
    $('aiBtn').addEventListener('click', runAi);
    $('aiCopy').addEventListener('click', () => copy(buildPrompt(), '已複製提示詞，貼到 ChatGPT、Claude 或其他 AI 助理即可'));
    if ($('aiRetry')) $('aiRetry').addEventListener('click', runAi);
    if ($('aiCopy2')) $('aiCopy2').addEventListener('click', () => copy(buildPrompt(), '已複製提示詞，貼到 ChatGPT、Claude 或其他 AI 助理即可'));
  }
  function bindVennFilter() {
    document.querySelectorAll('svg.venn .hit').forEach((h) => {
      const toggle = () => {
        const keys = h.dataset.filter.split(',');
        filter = filter && filter.join() === keys.join() ? null : keys;
        refreshRegions();
      };
      h.addEventListener('click', toggle);
      h.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
    });
    bindClearFilter();
  }
  function bindResult() {
    bindVennFilter();
    bindAi();
  }

  // ---------- career plan ----------
  function dirSuggestions() {
    const taken = new Set(state.plan.dirs.map((d) => d.title));
    return state.items
      .filter((it) => circlesOf(it).length >= 2 && !taken.has(it.text))
      .sort((a, b) => circlesOf(b).length - circlesOf(a).length)
      .slice(0, 6);
  }

  function dirHtml(d) {
    const isMain = d.id === state.plan.main;
    const fit = fitOf(d);
    return `
      <div class="dir${isMain ? ' main' : ''}" data-dir="${d.id}">
        <div class="dir-head">
          <label class="sr-only" for="dt-${d.id}">方向名稱</label>

    bindPlanAi();
    bindActions();
  }

  // ---------- cards (canvas) ----------
  const FONT = '"PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Heiti TC", sans-serif';
  const INK = '#1d1c1a';
  const MUTED = '#6b665e';
  function wrapLines(ctx, text, maxW, maxLines) {
    const lines = [];
    let line = '';
    [...text].forEach((ch) => {
      if (ch === '\n') { lines.push(line); line = ''; return; }
      if (ctx.measureText(line + ch).width > maxW && line) { lines.push(line); line = ch; } else line += ch;
    });
    if (line) lines.push(line);
    if (lines.length > maxLines) {
      const cut = lines.slice(0, maxLines);
      cut[maxLines - 1] = `${cut[maxLines - 1].slice(0, -1)}…`;
      return cut;
    }
    return lines;
  }
  function drawText(ctx, text, x, y, maxW, lineH, maxLines) {
    const lines = wrapLines(ctx, text, maxW, maxLines);
    lines.forEach((l, i) => ctx.fillText(l, x, y + i * lineH));
    return y + lines.length * lineH;
  }
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function cardBase(title, subtitle) {
    const cv = document.createElement('canvas');
    cv.width = 1080;
    cv.height = 1350;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#f6f5f2';
    ctx.fillRect(0, 0, 1080, 1350);
    // Brand mark
    CIRCLES.forEach((c, i) => {
      const [dx, dy] = [[0, -12], [-12, 0], [12, 0], [0, 12]][i];
      ctx.globalAlpha = 0.6;
      ctx.fillStyle = c.hex;
      ctx.beginPath(); ctx.arc(104 + dx, 96 + dy, 16, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
    ctx.fillStyle = INK;
    ctx.font = `700 30px ${FONT}`;
    ctx.fillText('IKIGAI 生き甲斐', 140, 107);
    ctx.font = `800 64px ${FONT}`;
    drawText(ctx, title, 80, 220, 920, 76, 2);
    if (subtitle) { ctx.fillStyle = MUTED; ctx.font = `400 32px ${FONT}`; ctx.fillText(subtitle, 80, 286); }
    return { cv, ctx };
  }
  function cardFooter(ctx) {
    ctx.fillStyle = MUTED;
    ctx.font = `400 26px ${FONT}`;
    ctx.fillText(`${today()} · 用四個圈找出人生方向`, 80, 1290);
  }
  function drawVenn(ctx, cx, cy, size, radii) {
    const k = size / 400;
    const pos = (key) => [cx + (CENTERS[key][0] - 200) * k, cy + (CENTERS[key][1] - 200) * k];
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    CIRCLES.forEach((c) => {
      const [x, y] = pos(c.key);
      ctx.beginPath(); ctx.arc(x, y, radii[c.key] * k, 0, Math.PI * 2);
      ctx.fillStyle = `${c.hex}55`; ctx.fill();
    });
    ctx.restore();
    CIRCLES.forEach((c) => {
      const [x, y] = pos(c.key);
      ctx.beginPath(); ctx.arc(x, y, radii[c.key] * k, 0, Math.PI * 2);
      ctx.strokeStyle = c.hex; ctx.lineWidth = 3; ctx.stroke();
    });
    // Circle names sit just outside each circle so they never cover the overlaps.
    ctx.fillStyle = INK;
    CIRCLES.forEach((c) => {
      const [x, y] = pos(c.key);
      const rr = radii[c.key] * k;
      const n = `${inCircle(c.key).length} 項`;
      const place = {
        love: { x, y: y - rr - 56, align: 'center' },
        paid: { x, y: y + rr + 46, align: 'center' },
        good: { x: x - rr - 18, y: y - 4, align: 'right' },
        need: { x: x + rr + 18, y: y - 4, align: 'left' },
      }[c.key];
      ctx.textAlign = place.align;
      ctx.fillStyle = INK;
      ctx.font = `700 40px ${FONT}`;
      ctx.fillText(c.short, place.x, place.y);
      ctx.fillStyle = MUTED;
      ctx.font = `400 28px ${FONT}`;
      ctx.fillText(n, place.x, place.y + 38);
    });
    ctx.textAlign = 'center';
    ctx.fillStyle = INK;
    ctx.font = `800 ${Math.round(30 * k)}px ${FONT}`;
    ctx.fillText('IKIGAI', cx, cy + 10);
    ctx.textAlign = 'left';
  }
  function drawIkigaiCard() {
    const { cv, ctx } = cardBase(`${owner()} IKIGAI`, `熱愛 ${inCircle('love').length} · 擅長 ${inCircle('good').length} · 世界需要 ${inCircle('need').length} · 報酬 ${inCircle('paid').length}`);
    drawVenn(ctx, 540, 690, 640, radiiFrom(countWeights()));
    const center = state.items.filter((it) => hasAll(it, KEYS)).map((it) => it.text);
    const near = state.items.filter((it) => circlesOf(it).length === 3).map((it) => it.text);
    ctx.fillStyle = INK;
    ctx.font = `700 34px ${FONT}`;
    ctx.fillText('IKIGAI 中心', 80, 1116);
    ctx.font = `400 34px ${FONT}`;
    let y = drawText(ctx, center.length ? center.join('、') : (near.length ? `接近中心：${near.join('、')}` : '還在探索中'), 80, 1164, 920, 46, 2);
    const dir = mainDir();
    if (dir && y < 1240) {
      ctx.fillStyle = MUTED; ctx.font = `400 30px ${FONT}`;
      y = drawText(ctx, `生涯方向：${dir.title}`, 80, y + 8, 920, 40, 1);
    }
    cardFooter(ctx);
    return cv;
  }
  function drawPairsCard() {
    const { cv, ctx } = cardBase('四個交集', '每一格是同時屬於兩個圈的項目');
    const boxes = PAIRS.slice(0, 4);
    boxes.forEach((p, i) => {
      const x = 80 + (i % 2) * 470;
      const y = 340 + Math.floor(i / 2) * 430;
      roundRect(ctx, x, y, 450, 400, 28);
      ctx.fillStyle = '#ffffff'; ctx.fill();
      ctx.fillStyle = BY_KEY[p.keys[0]].hex;
      ctx.fillRect(x, y + 40, 8, 80);
      ctx.fillStyle = INK; ctx.font = `800 40px ${FONT}`;
      ctx.fillText(p.short, x + 36, y + 80);
      ctx.fillStyle = MUTED; ctx.font = `400 24px ${FONT}`;
      ctx.fillText(`${BY_KEY[p.keys[0]].short} × ${BY_KEY[p.keys[1]].short}`, x + 36, y + 118);
      const items = state.items.filter((it) => hasAll(it, p.keys)).map((it) => it.text);
      ctx.fillStyle = INK; ctx.font = `400 32px ${FONT}`;
      drawText(ctx, items.length ? items.join('、') : '—', x + 36, y + 180, 380, 46, 5);
    });
    cardFooter(ctx);
    return cv;
  }
  function drawPlanCard() {
    const dir = mainDir();
    const { cv, ctx } = cardBase(`${owner()}生涯計畫`, '');
    ctx.fillStyle = MUTED; ctx.font = `400 30px ${FONT}`;
    ctx.fillText('主要方向', 80, 300);
    ctx.fillStyle = INK; ctx.font = `800 48px ${FONT}`;
    let y = drawText(ctx, dir.title, 80, 360, 920, 58, 2);
    // Fit bars
    y += 10;
    CIRCLES.forEach((c, i) => {
      const x = 80 + i * 232;
      ctx.fillStyle = MUTED; ctx.font = `400 24px ${FONT}`;
      ctx.fillText(`${c.short} ${dir.s[c.key]}/5`, x, y + 20);
      roundRect(ctx, x, y + 36, 200, 14, 7); ctx.fillStyle = '#e8e4dd'; ctx.fill();
      roundRect(ctx, x, y + 36, 200 * (dir.s[c.key] / 5), 14, 7); ctx.fillStyle = c.hex; ctx.fill();
    });
    y += 110;
    HORIZONS.forEach((h) => {
      const goal = state.plan.goals[h.key];
      if (!goal) return;
      ctx.fillStyle = MUTED; ctx.font = `700 26px ${FONT}`;
      ctx.fillText(h.label, 80, y);
      ctx.fillStyle = INK; ctx.font = `400 32px ${FONT}`;
      y = drawText(ctx, goal, 200, y, 800, 42, 2) + 22;
    });
    const acts = state.plan.actions.slice(0, 7);
    if (acts.length) {
      y += 10;
      ctx.fillStyle = INK; ctx.font = `700 30px ${FONT}`;
      const done = state.plan.actions.filter((a) => a.done).length;
      ctx.fillText(`行動清單（完成 ${done}/${state.plan.actions.length}）`, 80, y);
      y += 52;
      ctx.font = `400 30px ${FONT}`;
      acts.forEach((a) => {
        if (y > 1230) return;
        roundRect(ctx, 80, y - 26, 30, 30, 6);
        ctx.strokeStyle = a.done ? '#1f7a4f' : '#9a948a'; ctx.lineWidth = 3; ctx.stroke();
        if (a.done) { ctx.fillStyle = '#1f7a4f'; ctx.font = `800 26px ${FONT}`; ctx.fillText('✓', 85, y - 2); ctx.font = `400 30px ${FONT}`; }
        ctx.fillStyle = a.done ? MUTED : INK;
        const label = `${a.text}`;
        ctx.fillText(wrapLines(ctx, label, 840, 1)[0], 130, y);

  // ---------- share link ----------
  const toB64url = (bytes) => {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  };
  const fromB64url = (s) => {
    const bin = atob(s.replace(/-/g, '+').replace(/_/g, '/'));
    return Uint8Array.from(bin, (ch) => ch.charCodeAt(0));
  };
  async function encodeShare(obj) {
    const bytes = new TextEncoder().encode(JSON.stringify(obj));
    if (!window.CompressionStream) return `j${toB64url(bytes)}`;
    const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    return `z${toB64url(new Uint8Array(await new Response(stream).arrayBuffer()))}`;
  }
  async function decodeShare(code) {
    const bytes = fromB64url(code.slice(1));
    if (code[0] === 'j') return JSON.parse(new TextDecoder().decode(bytes));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return JSON.parse(await new Response(stream).text());
  }
  // Compact form: items as [text, circle bitmask], plan as arrays.
  function packShare(includeAi, includePlan) {
    const pack = { v: 1, n: state.name, i: state.items.map((it) => [it.text, KEYS.reduce((m, k, b) => m | (it.c[k] ? 1 << b : 0), 0)]) };
    if (state.note) pack.t = state.note;
    if (includeAi && state.ai) pack.a = state.ai;
    const dir = mainDir();
    if (includePlan && dir) {
      pack.p = {
        d: state.plan.dirs.map((d) => [d.title, ...KEYS.map((k) => d.s[k])]),
        m: state.plan.dirs.indexOf(dir),
        g: HORIZONS.map((h) => state.plan.goals[h.key]),
        x: state.plan.actions.map((a) => [a.text, HORIZONS.findIndex((h) => h.key === a.h), a.done ? 1 : 0]),
      };
    }
    return pack;
  }
  function unpackShare(pack) {
    const data = {
      name: pack.n,
      note: pack.t,
      ai: pack.a,
      items: (pack.i || []).map(([text, mask]) => ({ text, c: Object.fromEntries(KEYS.map((k, b) => [k, Boolean(mask & (1 << b))])) })),
      plan: null,
    };
    if (pack.p) {
      const dirs = (pack.p.d || []).map(([title, ...nums], i) => ({ id: `d${i}`, title, s: Object.fromEntries(KEYS.map((k, j) => [k, nums[j]])) }));
      data.plan = {
        dirs,
        main: dirs[pack.p.m]?.id,
        goals: Object.fromEntries(HORIZONS.map((h, i) => [h.key, (pack.p.g || [])[i]])),
        actions: (pack.p.x || []).map(([text, h, done]) => ({ text, h: HORIZONS[h]?.key, done: Boolean(done) })),
      };
    }
    return sanitize(data);
  }

  function serverError(code) {
    if (code === 504) return '伺服器執行超過時間上限（504）。請稍後再試，或把 IKIGAI_MAX_TOKENS 調低';
    if (code === 404) return '找不到分析服務（404），可能是 IKIGAI_ENABLED 被設為 false';
    if (code === 413) return '送出的內容太大（413），請減少項目';
    return `伺服器錯誤（狀態碼 ${code}），請查看 Vercel Logs`;
  }
  async function postJson(path, body) {
    let res;
    try {
      res = await fetch(`${apiBase()}/${path}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    } catch (err) {
      throw new Error('連不到伺服器，請檢查網路後再試');
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || serverError(res.status));
    return data;
  }

    const t = e.target.closest('button');
    if (!t) return;
    if (t.dataset.remove) { removeFromCircle(t.dataset.remove, t.dataset.key); render(); return; }
    if (t.dataset.chip) { const r = addItem(state.step, t.dataset.chip); save(); if (r === 'full') toast('每個圈最多 20 項'); render(); return; }
    if (t.dataset.mf) { matchFilter = t.dataset.mf; renderMatch(); return; }
    if (t.dataset.sugg) {
      const it = state.items.find((x) => x.id === t.dataset.sugg);
      if (it) addDirection(it.text, Object.fromEntries(KEYS.map((k) => [k, it.c[k] ? 4 : 2])));
      return;
    }
    if (t.dataset.main) { state.plan.main = t.dataset.main; save(); renderPlan(); return; }
    if (t.dataset.deldir) {
      const before = JSON.parse(JSON.stringify(state.plan));
      const d = state.plan.dirs.find((x) => x.id === t.dataset.deldir);
      state.plan.dirs = state.plan.dirs.filter((x) => x.id !== t.dataset.deldir);
      if (state.plan.main === t.dataset.deldir) state.plan.main = state.plan.dirs[0]?.id || null;
      save();
      renderPlan();
      toast(`已刪除方向「${d ? d.title : ''}」`, { label: '復原', run: () => { state.plan = before; save(); renderPlan(); } });
      return;
    }
    if (t.dataset.delact) {
      state.plan.actions = state.plan.actions.filter((a) => a.id !== t.dataset.delact);
      save();
      refreshActions();
      return;
    }
    if (t.classList.contains('toggle')) {
      const it = state.items.find((x) => x.id === t.dataset.id);
      if (!it) return;
      const on = !it.c[t.dataset.key];
      if (!on && circlesOf(it).length === 1) { toast('每一項至少要屬於一個圈；不需要的話，回到該圈刪除'); return; }
      it.c[t.dataset.key] = on;
      state.ai = '';
      save();
      t.setAttribute('aria-pressed', String(on));
      t.closest('.item').querySelectorAll('.dots i').forEach((d, i) => d.classList.toggle('on', it.c[KEYS[i]]));
      renderProgress();
      renderNav();
    }
  });
  $('view').addEventListener('change', (e) => {
    const cb = e.target.closest('input[data-act]');
    if (!cb) return;
    const a = state.plan.actions.find((x) => x.id === cb.dataset.act);
    if (!a) return;
    a.done = cb.checked;
    save();
    refreshActions();
    if (a.done && state.plan.actions.every((x) => x.done)) toast('全部行動都完成了！');
  });
  document.addEventListener('keydown', (e) => {
    if (shareMode || e.target.matches('input, textarea, select')) return;
    if (e.key === 'ArrowRight' && state.step !== 'plan' && state.step !== 'intro') go(nextOf(state.step));
    if (e.key === 'ArrowLeft' && state.step !== 'intro') go(prevOf(state.step));
  });
  window.addEventListener('hashchange', () => { if (location.hash.startsWith('#s=')) enterShare(); });

  fetch(`${apiBase()}/status`).then((r) => r.json()).then((d) => {
    aiAvailable = Boolean(d.ai);
    if (shareMode || aiBusy || planBusy) return;
    if (state.step === 'result') refreshAi();
    if (state.step === 'plan') refreshPlanBlock();
  }).catch(() => {});

  if (location.hash.startsWith('#s=')) enterShare();
  else render();
})();
</script>
</body>
</html>
